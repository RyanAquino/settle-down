name: Publish Expo Go previews

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Restore a previous Expo preview release (leave blank for current main)'
        type: string
        required: false

permissions:
  actions: read
  contents: read

# Keep a new publish and a restore from interleaving across the two Expo projects.
concurrency:
  group: expo-previews-${{ github.ref }}-${{ github.actor }}-${{ github.triggering_actor }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Expo preview release
    if: >-
      github.ref == 'refs/heads/main' &&
      github.actor_id == github.repository_owner_id &&
      (github.run_attempt == 1 || github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      commit: ${{ steps.select.outputs.commit }}
      mode: ${{ steps.select.outputs.mode }}
      groups: ${{ steps.select.outputs.groups }}
    steps:
      - if: inputs.release_tag == ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select a preview release
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.release_tag }}
          RELEASE_QUERY: |
            query($owner:String!, $repo:String!, $tag:String!, $ref:String!) {
              repository(owner:$owner, name:$repo) {
                release(tagName:$tag) { isDraft isPrerelease }
                ref(qualifiedName:$ref) { id }
              }
            }
        run: |
          tag=$REQUESTED
          if [[ -z "$tag" ]]; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [[ "$current" != "$GITHUB_SHA" ]]; then
              echo "Skipping superseded main commit $GITHUB_SHA."
              exit 0
            fi
            version=$(jq -er '.expo.version | strings' app.json)
            tag="v$version-$GITHUB_SHA"
          fi
          version_pattern='[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.+-]+)?'
          if [[ ! "$tag" =~ ^(v${version_pattern}|expo-preview)-[0-9a-f]{40}$ ]]; then
            echo "::error::Expected a versioned preview tag or a legacy expo-preview tag."
            exit 1
          fi
          commit=${tag##*-}
          metadata=$(gh api graphql -f owner="$GITHUB_REPOSITORY_OWNER" -f repo="${GITHUB_REPOSITORY#*/}" \
            -f tag="$tag" -f ref="refs/tags/$tag" -f query="$RELEASE_QUERY" --jq '.data.repository')
          if jq -e '.ref != null' <<< "$metadata" > /dev/null; then
            ref=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')
            if [[ "$ref" != "$commit" ]]; then
              echo "::error::Preview tag $tag points to $ref instead of $commit."
              exit 1
            fi
          fi
          if jq -e '.release != null and (.release.isDraft | not)' <<< "$metadata" > /dev/null; then
            if ! jq -e '.release.isPrerelease and .ref != null' <<< "$metadata" > /dev/null; then
              echo "::error::Expected a tagged Expo prerelease."
              exit 1
            fi
            saved=$(gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern expo-groups.json --output -)
            groups=$(jq -ce 'select(keys == ["org-ryan","ryan.aquino"]) |
              select(all(.[]; type == "string" and test("^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$")))' <<< "$saved")
            echo "groups=$groups" >> "$GITHUB_OUTPUT"
            echo "mode=restore" >> "$GITHUB_OUTPUT"
          elif [[ -n "$REQUESTED" ]]; then
            echo "::error::Choose a published preview release from GitHub Releases."
            exit 1
          else
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Require successful main CI for the selected preview
        if: steps.select.outputs.tag
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: &require-main-ci |
            const sha = context.payload.inputs?.release_tag
              ? (await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' })).data.object.sha
              : context.sha;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...context.repo, branch: 'main', event: 'push', head_sha: sha, per_page: 100,
            });

            // A missing required workflow must block just as a failed run would.
            const latest = new Map([
              ['.github/workflows/quality.yml', null],
              ['.github/workflows/native.yml', null],
              ['.github/workflows/security.yml', null],
            ]);
            for (const run of runs) {
              const previous = latest.get(run.path);
              if (!previous || run.run_number > previous.run_number) latest.set(run.path, run);
            }
            for (const [path, run] of latest) {
              if (!run) {
                core.setFailed(`Preview blocked for main@${sha}. No push run found for ${path}.`);
              } else if (run.status !== 'completed' || run.conclusion !== 'success') {
                const result = run.status === 'completed' ? run.conclusion : run.status;
                core.setFailed(`Preview blocked for main@${sha}. ${run.name}: ${result} (${run.html_url}).`);
              }
            }

  publish:
    name: Publish preview (${{ matrix.owner }})
    needs: prepare
    if: needs.prepare.outputs.tag && (github.run_attempt == 1 || github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        owner: [org-ryan, ryan.aquino]
    concurrency:
      group: publish-preview-${{ matrix.owner }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm install --global eas-cli@24.7.0
      - name: Recheck main CI before publishing to Expo
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: *require-main-ci
      - name: Publish or restore iOS and Android on preview
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_OWNER: ${{ matrix.owner }}
          MODE: ${{ needs.prepare.outputs.mode }}
          GROUP: ${{ fromJSON(needs.prepare.outputs.groups || '{}')[matrix.owner] }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          REQUESTED: ${{ inputs.release_tag }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$COMMIT" ]]; then
            echo "::error::Checked-out commit does not match the preview release."
            exit 1
          fi
          if [[ -z "$REQUESTED" ]]; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [[ "$current" != "$COMMIT" ]]; then
              echo "::error::Main moved to $current. Start a new preview for that commit."
              exit 1
            fi
          fi
          if [[ "$MODE" == restore ]]; then
            if [[ -z "$GROUP" ]]; then
              echo "::error::Release $TAG is missing the update group for $EAS_PROJECT_OWNER."
              exit 1
            fi
            eas update:republish --group "$GROUP" --destination-channel preview \
              --platform all --non-interactive --message "$TAG"
          elif [[ "$MODE" == publish && -z "$REQUESTED" ]]; then
            updates=$(eas update --channel preview --environment preview --platform all \
              --message "$TAG" --non-interactive --json)
            if ! jq -e --arg sha "$COMMIT" --arg owner "$EAS_PROJECT_OWNER" '
              select(map(.platform) | sort == ["android","ios"]) |
              select(all(.[]; .gitCommitHash == $sha)) |
              map(.group) | unique | select(length == 1) | .[0] |
              select(type == "string" and test("^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$")) |
              {($owner): .}
            ' <<< "$updates" > "$RUNNER_TEMP/$EAS_PROJECT_OWNER.json"; then
              echo "::error::Expo did not return one iOS and Android update group for $EAS_PROJECT_OWNER at $COMMIT."
              exit 1
            fi
          else
            echo "::error::No publish or restore operation was selected for $TAG."
            exit 1
          fi
      - name: Save the published update group
        if: needs.prepare.outputs.mode == 'publish'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-group-${{ matrix.owner }}
          path: ${{ runner.temp }}/${{ matrix.owner }}.json
          if-no-files-found: error
          overwrite: true

  release:
    name: Record the published Expo preview
    needs: [prepare, publish]
    if: needs.prepare.outputs.mode == 'publish' && (github.run_attempt == 1 || github.triggering_actor == github.repository_owner)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: preview-group-*
          merge-multiple: true
          path: groups
      - name: Recheck main CI before creating the prerelease
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: *require-main-ci
      - name: Attach both original update group IDs to the tagged prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          jq -es 'add | select(keys == ["org-ryan","ryan.aquino"]) |
            select(all(.[]; type == "string" and test("^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$")))' \
            groups/org-ryan.json groups/ryan.aquino.json > expo-groups.json
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            gh release create "$TAG" expo-groups.json --target "$COMMIT" \
              --prerelease --title "Expo Go preview ${TAG%-*} (${COMMIT:0:12})" --generate-notes
          elif [[ "$draft" == true ]]; then
            gh release upload "$TAG" expo-groups.json --clobber
            gh release edit "$TAG" --target "$COMMIT" --draft=false --prerelease
          fi
          published=$(gh release view "$TAG" --json isDraft,isPrerelease --jq '(.isDraft | not) and .isPrerelease')
          ref=$(gh api "repos/$GH_REPO/commits/$TAG" --jq '.sha')
          recorded=$(gh release download "$TAG" --pattern expo-groups.json --output -)
          if [[ "$published" != true || "$ref" != "$COMMIT" ]] || ! jq -e --argjson saved "$recorded" '. == $saved' expo-groups.json > /dev/null; then
            echo "::error::Release $TAG does not match the published commit and update groups."
            exit 1
          fi
