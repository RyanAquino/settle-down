name: Verify iOS PR

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  request:
    name: Authorize verification
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/verify') && github.event.comment.user.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: verify-admission-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      checks: write
      actions: read
    outputs:
      accepted: ${{ steps.request.outputs.accepted }}
      head_sha: ${{ steps.request.outputs.head_sha }}
      base_sha: ${{ steps.request.outputs.base_sha }}
      request_artifact: ${{ steps.request.outputs.request_artifact }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: ci
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --prefix ci/tools/verify-ios --ignore-scripts --omit=dev
      - id: request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { admit } = await import(`${process.env.GITHUB_WORKSPACE}/ci/tools/verify-ios/github.mjs`);
            await admit({ github, context, core, outputDir: `${process.env.RUNNER_TEMP}/verify-request` });
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verify-request-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-request/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build captured PR
    needs: request
    if: needs.request.outputs.accepted == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      app_artifact: ${{ steps.artifact.outputs.name }}
    # issue_comment is read-only for caches by default. This job only runs after
    # writer authorization on a repository-owned PR head, with no secrets or
    # repository write token. Cache writes are deliberately limited to this job.
    cache-mode: write
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}/pr-source
      CCACHE_NOHASHDIR: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: ci
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.request.outputs.head_sha }}
          path: pr-source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pr-source/package-lock.json
      - run: npm ci --prefix ci/tools/verify-ios --ignore-scripts --omit=dev
      - name: Compute exact build identity
        id: build-key
        run: node ci/tools/verify-ios/build-key.mjs pr-source
      - name: Restore exact simulator binary
        id: app-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/verify-build/cache
          key: ${{ steps.build-key.outputs.key }}
      - name: Validate reused simulator binary
        id: cached-app
        if: steps.app-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        env:
          VERIFY_BUILD_KEY: ${{ steps.build-key.outputs.key }}
        run: node ci/tools/verify-ios/build.mjs pr-source "$RUNNER_TEMP/verify-build" --validate-only
      - name: Cache native downloads
        if: steps.cached-app.outcome != 'success'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/ReactNative
            ~/.cocoapods/repos
          key: ios-downloads-macos26-xcode26.6-arm64-v1-${{ hashFiles('pr-source/package-lock.json') }}
          restore-keys: ios-downloads-macos26-xcode26.6-arm64-v1-
      - name: Cache native compiler results
        if: steps.cached-app.outcome != 'success'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ios-ccache-macos26-xcode26.6-arm64-v1-${{ hashFiles('pr-source/package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ios-ccache-macos26-xcode26.6-arm64-v1-${{ hashFiles('pr-source/package-lock.json') }}-
      - name: Prepare compiler cache
        if: steps.cached-app.outcome != 'success'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          command -v ccache >/dev/null || brew install ccache
          ccache --max-size=500M
          ccache --zero-stats
      - name: Build Release simulator binary
        if: steps.cached-app.outcome != 'success'
        env:
          VERIFY_BUILD_KEY: ${{ steps.build-key.outputs.key }}
        run: node ci/tools/verify-ios/build.mjs pr-source "$RUNNER_TEMP/verify-build"
      - name: Cache validated simulator binary
        if: success() && steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/verify-build/cache
          key: ${{ steps.build-key.outputs.key }}
      - id: artifact
        run: echo "name=ios-app-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/verify-build/app.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-build-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/verify-build/*.log
            ${{ runner.temp }}/verify-build/expo-config.json
            ${{ runner.temp }}/verify-build/timings.json
            pr-source/.expo/xcodebuild*.log
          retention-days: 7
          if-no-files-found: warn

  verify:
    name: Agentic iOS verification
    needs: [request, build]
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      copilot-requests: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: ci
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.request.outputs.head_sha }}
          path: pr-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --prefix ci/tools/verify-ios --ignore-scripts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.request.outputs.request_artifact }}
          path: ${{ runner.temp }}/verify-request
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.build.outputs.app_artifact }}
          path: ${{ runner.temp }}/verify-app
      - name: Install pinned Maestro
        shell: bash
        run: |
          mkdir -p "$HOME/.maestro"
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-install"
          echo "$RUNNER_TEMP/maestro-install/maestro/bin" >> "$GITHUB_PATH"
      - name: Explore PR behavior and replay saved tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ci/tools/verify-ios/runner.mjs pr-source "$RUNNER_TEMP/verify-request" "$RUNNER_TEMP/verify-app/app.tar.gz" "$RUNNER_TEMP/ios-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-evidence/
          retention-days: 7
          if-no-files-found: warn
