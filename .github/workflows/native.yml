name: Native smoke

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'utils/**'
      - 'package*.json'
      - 'app.config.*'
      - 'app.json'
      - 'eas.json'
      - 'tsconfig.json'
      - 'babel.config.*'
      - 'metro.config.*'
      - '.nvmrc'
      - '.npmrc'
      - '.maestro/**'
      - 'tools/ci/**'
      - '.github/workflows/native.yml'
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  CI_E2E: '1'
  EXPO_NO_DOTENV: '1'
  EXPO_PUBLIC_API_BASE_URL: https://ci.invalid
  EXPO_PUBLIC_AUTH_TOKEN: ''
  EXPO_PUBLIC_SHOW_DEBUG_SKIP_BUTTON: 'false'
  MAESTRO_CLI_NO_ANALYTICS: '1'

jobs:
  ios:
    name: iOS Release smoke
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Build simulator binary
        run: npx --no-install expo run:ios --configuration Release --device generic --no-bundler --output "$RUNNER_TEMP/ios-binary"
      - name: Install Maestro
        run: |
          bash tools/ci/install-maestro.sh "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Run committed smoke test
        run: |
          apps=("$RUNNER_TEMP"/ios-binary/*.app)
          test "${#apps[@]}" -eq 1
          bash tools/ci/smoke-ios.sh "${apps[0]}" test-results/ios
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-ios-evidence
          path: |
            test-results/ios/
            .expo/xcodebuild*.log
          retention-days: 7
          if-no-files-found: warn

  android:
    name: Android Release smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx --no-install expo prebuild --platform android --no-install
      - name: Build and lint Android release
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:lintRelease --no-daemon
      - name: Install Maestro
        run: |
          bash tools/ci/install-maestro.sh "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p test-results/android
            adb install android/app/build/outputs/apk/release/app-release.apk
            maestro test --format junit --output test-results/android/junit.xml --test-output-dir test-results/android .maestro/launch.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-android-evidence
          path: |
            test-results/android/
            android/app/build/reports/lint-results-release.*
          retention-days: 7
          if-no-files-found: warn
