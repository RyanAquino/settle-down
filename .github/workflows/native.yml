name: Native smoke

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'plugins/**'
      - 'utils/**'
      - 'package*.json'
      - 'app.config.*'
      - 'app.json'
      - 'eas.json'
      - 'tsconfig.json'
      - 'babel.config.*'
      - 'metro.config.*'
      - '.nvmrc'
      - '.npmrc'
      - '.maestro/**'
      - 'tools/ci/**'
      - '.github/workflows/native.yml'
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  CI_E2E: '1'
  EXPO_NO_DOTENV: '1'
  EXPO_PUBLIC_API_BASE_URL: https://ci.invalid
  EXPO_PUBLIC_AUTH_TOKEN: ''
  EXPO_PUBLIC_SHOW_DEBUG_SKIP_BUTTON: 'false'
  MAESTRO_CLI_NO_ANALYTICS: '1'

jobs:
  ios:
    name: iOS Release smoke
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Start iOS simulator
        id: simulator
        run: |
          device=$(bash tools/ci/boot-smoke-ios.sh)
          echo "device=$device" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Cache CocoaPods and React Native downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/Library/Caches/ReactNative
            ~/.cocoapods/repos
          key: ios-downloads-macos26-xcode26.6-arm64-v1-${{ hashFiles('package-lock.json') }}
          restore-keys: ios-downloads-macos26-xcode26.6-arm64-v1-
      - name: Restore Xcode compilation results
        id: xcode-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
          key: smoke-clang-swift-xcode26.6-arm64-v1-${{ hashFiles('package-lock.json', 'modules/**', 'plugins/**', 'app.json', 'app.config.*') }}
          restore-keys: smoke-clang-swift-xcode26.6-arm64-v1-
      - name: Build simulator binary
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/tools/ci/smoke.xcconfig
          EXPO_PROFILE: '1'
        run: npx --no-install expo run:ios --configuration Release --device generic --no-bundler --output "$RUNNER_TEMP/ios-binary"
      - name: Cache Xcode compilation results
        if: steps.xcode-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
          key: ${{ steps.xcode-cache.outputs.cache-primary-key }}
      - name: Install Maestro
        run: |
          bash tools/ci/install-maestro.sh "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Run committed smoke test
        env:
          SMOKE_DEVICE: ${{ steps.simulator.outputs.device }}
        run: |
          apps=("$RUNNER_TEMP"/ios-binary/*.app)
          test "${#apps[@]}" -eq 1
          bash tools/ci/smoke-ios.sh "${apps[0]}" test-results/ios "$SMOKE_DEVICE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-ios-evidence
          path: |
            test-results/ios/
            .expo/xcodebuild*.log
          retention-days: 7
          if-no-files-found: warn

  android:
    name: Android Release smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx --no-install expo prebuild --platform android --no-install
      - name: Restore Gradle task outputs
        id: gradle-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: smoke-gradle-ubuntu24-java17-v1-${{ hashFiles('package-lock.json', 'modules/**', 'plugins/**', 'app.json', 'app.config.*') }}
          restore-keys: smoke-gradle-ubuntu24-java17-v1-
      - name: Build and lint Android release
        working-directory: android
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/android-gradle.log"
          # R8 and lint can exhaust the generated default of 512 MiB of metaspace.
          gradle_args=(
            :app:assembleRelease :app:lintRelease --build-cache --no-daemon
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+ExitOnOutOfMemoryError'
          )
          if ./gradlew "${gradle_args[@]}" 2>&1 | tee "$log"; then
            exit 0
          fi
          if ! grep -q 'Could not resolve all artifacts' "$log"; then
            exit 1
          fi
          echo "::warning::Gradle failed to resolve dependencies. Retrying once."
          sleep 30
          ./gradlew "${gradle_args[@]}" --refresh-dependencies
      - name: Cache Gradle task outputs
        if: steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Install Maestro
        run: |
          bash tools/ci/install-maestro.sh "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p test-results/android
            adb install android/app/build/outputs/apk/release/app-release.apk
            maestro test --format junit --output test-results/android/junit.xml --test-output-dir test-results/android .maestro/launch.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-android-evidence
          path: |
            test-results/android/
            android/app/build/reports/lint-results-release.*
          retention-days: 7
          if-no-files-found: warn
