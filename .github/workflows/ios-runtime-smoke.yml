name: iOS runtime cleanup smoke

on:
  push:
    branches: [test/ios-mobileasset-cleanup]

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: no-rescan
            runner: xcode-27
            xcode: '27.1'
          - mode: no-rescan
            runner: xcode-27
            xcode: '27.2'
          - mode: preinstalled
            runner: macos-26
            xcode: '26.6'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      SMOKE_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare and boot the pinned runtime
        run: |
          mkdir -p "$RUNNER_TEMP/runtime-evidence"
          node --input-type=module <<'JS'
          import { prepareRuntime } from './tools/verify-ios/runtime-preparation.mjs';
          import { run } from './tools/verify-ios/process.mjs';
          import { access } from 'node:fs/promises';
          const runtime = 'com.apple.CoreSimulator.SimRuntime.iOS-26-5';
          const evidence = `${process.env.RUNNER_TEMP}/runtime-evidence`;
          try {
            const runWithoutRescan = (command, args, options) => {
              if (command === 'xcrun' && args[2] === 'scan-and-mount') {
                console.log('Skipping the rescan for this smoke variant');
                return { output: '', code: 0 };
              }
              return run(command, args, options);
            };
            let result;
            if (process.env.SMOKE_MODE === 'preinstalled') {
              const listed = await run('xcrun', ['simctl', 'list', 'runtimes', '-j'], { timeout: 180000, log: `${evidence}/runtime-list.log` });
              result = JSON.parse(listed.output).runtimes.find(item => item.identifier === runtime && item.isAvailable);
              if (!result) throw new Error('Pinned 26.5 runtime is not preinstalled');
              result = { identifier: result.identifier, version: result.version, build: result.buildversion };
            } else {
              result = await prepareRuntime({ run: runWithoutRescan, evidence, allowDownload: true });
            }
            console.log(JSON.stringify(result, null, 2));
            const created = await run('xcrun', ['simctl', 'create', 'Runtime cleanup smoke', 'com.apple.CoreSimulator.SimDeviceType.iPhone-17', result.identifier]);
            const udid = created.output.trim();
            try {
              await run('xcrun', ['simctl', 'boot', udid]);
              await run('xcrun', ['simctl', 'bootstatus', udid, '-b'], { timeout: 360000, log: `${evidence}/boot.log` });
              const started = await run('xcrun', ['simctl', 'spawn', udid, 'launchctl', 'print', 'system']);
              console.log(`Simulator ${udid} booted and returned ${started.output.length} bytes from launchctl.`);
            } finally {
              for (const action of ['shutdown', 'delete']) await run('xcrun', ['simctl', action, udid], { allowFailure: true, timeout: 10000 });
            }
          } catch (error) {
            console.error(error);
            process.exitCode = 1;
            const listed = await run('xcrun', ['simctl', 'runtime', 'list', '-j'], { log: `${evidence}/diagnostic-images.log` });
            for (const image of Object.values(JSON.parse(listed.output)).filter(image => image.runtimeIdentifier === runtime)) {
              console.log(JSON.stringify(image));
              for (const directory of [image.path, image.parentMountPath, image.mountPath, image.runtimeBundlePath]) {
                if (!directory) continue;
                await access(directory).then(() => console.log('Accessible', directory), error => console.log(error.message));
              }
            }
            await run('log', ['show', '--last', '3m', '--predicate', '(process == "simdiskimaged" OR process == "CoreSimulatorService") AND (eventMessage CONTAINS[c] "26.5" OR eventMessage CONTAINS[c] "23F")'], { log: `${evidence}/runtime-system.log`, timeout: 45000, allowFailure: true });
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-evidence-${{ matrix.mode }}-${{ matrix.xcode }}
          path: ${{ runner.temp }}/runtime-evidence/
          retention-days: 2
