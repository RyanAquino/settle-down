name: iOS verification applicability

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  applicability:
    name: Determine iOS verification applicability
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      # The base commit supplies the script. PR files are read as metadata only.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { skipIfExempt } = await import(`${process.env.GITHUB_WORKSPACE}/tools/verify-ios/applicability.mjs`);
            await skipIfExempt({ github, context, core });
