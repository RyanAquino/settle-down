name: Report iOS verification

on:
  workflow_run:
    workflows: [Verify iOS PR]
    types: [completed]

permissions: {}

jobs:
  report:
    if: github.event.workflow_run.event == 'issue_comment' && github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: verify-report-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write # Store fallback preview images on the evidence branch.
      pull-requests: write
      checks: write
    steps:
      # Never check out the PR or execute anything from downloaded artifacts.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --prefix tools/verify-ios --ignore-scripts --omit=dev
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        continue-on-error: true
        with:
          name: verify-request-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/verify-report/request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        continue-on-error: true
        with:
          name: ios-evidence-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/verify-report/evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Prepare inline replay previews
        if: steps.evidence.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            if ! (sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg); then
              echo "::warning::FFmpeg unavailable. Preparing screenshots only."
            fi
          fi
          node tools/verify-ios/prepare-previews.mjs "$RUNNER_TEMP/verify-report/evidence" "$RUNNER_TEMP/verify-report/previews"
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          IOS_EVIDENCE_UPLOAD_TOKEN: ${{ secrets.IOS_EVIDENCE_UPLOAD_TOKEN }}
        with:
          script: |
            const { publish } = await import(`${process.env.GITHUB_WORKSPACE}/tools/verify-ios/github.mjs`);
            await publish({ github, context, core, directory: `${process.env.RUNNER_TEMP}/verify-report` });
