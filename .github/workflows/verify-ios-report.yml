name: Report iOS verification

on:
  workflow_run:
    workflows: [Verify iOS PR]
    types: [completed]

permissions: {}

jobs:
  report:
    if: github.event.workflow_run.event == 'issue_comment' && github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: verify-report-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
      checks: write
    steps:
      # Never check out the PR or execute anything from downloaded artifacts.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --prefix tools/verify-ios --ignore-scripts --omit=dev
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: verify-request-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/verify-report/request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: ios-evidence-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/verify-report/evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/github-script@v8
        with:
          script: |
            const { publish } = await import(`${process.env.GITHUB_WORKSPACE}/tools/verify-ios/github.mjs`);
            await publish({ github, context, core, directory: `${process.env.RUNNER_TEMP}/verify-report` });
