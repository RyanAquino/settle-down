appId: com.ryan.aquino.settledown
name: First launch asks for a Settle Up account
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- assertVisible: 'Sign in with Settle Up'
- assertVisible:
    id: account-email
- assertVisible:
    id: account-password
- takeScreenshot: launch
