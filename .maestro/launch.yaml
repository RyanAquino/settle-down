appId: com.ryan.aquino.settledown
name: Camera screen launches in a release build
---
# The iOS smoke runner just installed the app on a new simulator. Reinstalling
# it again can asynchronously revoke the camera grant after launch.
- runFlow:
    when:
      true: ${typeof FRESH_IOS_INSTALL === 'undefined'}
    commands:
      - clearState
- launchApp:
    permissions:
      all: allow
- assertVisible: 'Point at a receipt'
- assertVisible:
    id: pick-receipt
- assertVisible: 'Capture receipt'
- takeScreenshot: launch
